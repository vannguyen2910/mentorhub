<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1130" width="1500" height="1130" font-family="JetBrains Mono, monospace" font-size="16"><rect width="1500" height="1130" fill="#ffffff"/><text x="40" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1a1a1a">5 layer để đánh giá một màn hình</text><text x="40" y="115" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#8a8a8a">Đọc theo thứ tự, dừng ở layer đầu tiên không ổn. Mỗi layer kết thúc bằng một câu nói được với developer.</text><rect x="40" y="150" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="40" y1="210" x2="490" y2="210" stroke="#1a1a1a" stroke-width="1.5"/><text x="58" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">1. Space</text><text x="58" y="245" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Cái nào thuộc nhóm nào?</text><text x="58" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Mọi khoảng cách là bội số của 8.</text><text x="58" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Cùng nhóm: gap nhỏ. Khác nhóm: gap lớn.</text><text x="58" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Đừng dùng border để sửa lỗi spacing.</text><line x1="72.0" y1="391.0" x2="188.0" y2="391.0" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/><line x1="71.5" y1="409.0" x2="288.5" y2="409.0" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/><line x1="72.0" y1="445.0" x2="188.0" y2="445.0" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/><line x1="71.5" y1="463.0" x2="288.5" y2="463.0" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/><path d="M340 415v24M334 415h12M334 439h12" stroke="#6B46C1" stroke-width="2" fill="none"/><text x="352" y="432.0" fill="#6B46C1" text-anchor="start" font-size="16">8</text><text x="58" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a"><tspan x="58" dy="0">“Hai cái này cùng nhóm nên gap là 8, nhóm kế</tspan><tspan x="58" dy="22">tiếp là 24. Đó là thang chia, không phải sở</tspan><tspan x="58" dy="22">thích.”</tspan></text><rect x="520" y="150" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="520" y1="210" x2="970" y2="210" stroke="#1a1a1a" stroke-width="1.5"/><text x="538" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">2. Hierarchy</text><text x="538" y="245" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Cái gì được đọc đầu tiên?</text><text x="538" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Chỉ một thứ là primary.</text><text x="538" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">4 đòn bẩy: size, weight, colour, space.</text><text x="538" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Nhấn mạnh có ngân sách cố định.</text><line x1="555.5" y1="402.0" x2="744.5" y2="402.0" stroke="#8a8a8a" stroke-width="11" stroke-linecap="round"/><line x1="551.5" y1="437.0" x2="808.5" y2="437.0" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/><rect x="550" y="465" width="130" height="38" rx="8" fill="#1a1a1a"/><text x="538" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a"><tspan x="538" dy="0">“Status là primary. Nếu không thể to nhất thì</tspan><tspan x="538" dy="22">phải có contrast cao nhất.”</tspan></text><rect x="1000" y="150" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="1000" y1="210" x2="1450" y2="210" stroke="#1a1a1a" stroke-width="1.5"/><text x="1018" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">3. Type</text><text x="1018" y="245" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Thứ tự đọc có còn đọc được không?</text><text x="1018" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">3 cỡ chữ, 2 độ đậm, đều nằm trên scale.</text><text x="1018" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Line height thuộc về cỡ chữ.</text><text x="1018" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Cần cỡ thứ 4? Lỗi nằm ở Layer 2.</text><line x1="1034.5" y1="398.0" x2="1205.5" y2="398.0" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><line x1="1032.5" y1="432.0" x2="1267.5" y2="432.0" stroke="#8a8a8a" stroke-width="5" stroke-linecap="round"/><line x1="1031.5" y1="455.0" x2="1328.5" y2="455.0" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/><line x1="1031.5" y1="471.0" x2="1288.5" y2="471.0" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/><text x="1018" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a"><tspan x="1018" dy="0">“Ba cỡ, hai weight, đều trên scale. Cần cỡ thứ</tspan><tspan x="1018" dy="22">tư thì có gì đó phía trên đang sai.”</tspan></text><rect x="40" y="640" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="40" y1="700" x2="490" y2="700" stroke="#1a1a1a" stroke-width="1.5"/><text x="58" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">4. Colour</text><text x="58" y="735" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Hành động chính là gì?</text><text x="58" y="770" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Màu là vai trò, không phải bảng màu.</text><text x="58" y="796" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Primary là thứ duy nhất bão hoà.</text><text x="58" y="822" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Contrast: 4.5:1 chữ thường, 3:1 chữ lớn. Đo bằng tool.</text><rect x="70" y="875" width="60" height="50" rx="6" fill="none" stroke="#6B46C1" stroke-width="3"/><rect x="146" y="875" width="60" height="50" rx="6" fill="none" stroke="#8a8a8a" stroke-width="3"/><rect x="222" y="875" width="60" height="50" rx="6" fill="none" stroke="#2f9e6b" stroke-width="3"/><rect x="298" y="875" width="60" height="50" rx="6" fill="none" stroke="#e0a000" stroke-width="3"/><rect x="374" y="875" width="60" height="50" rx="6" fill="none" stroke="#d64545" stroke-width="3"/><text x="58" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a"><tspan x="58" dy="0">“Đỏ là role error. Dùng cho nút chính thì màn</tspan><tspan x="58" dy="22">hình này không còn báo lỗi được.”</tspan></text><rect x="520" y="640" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="520" y1="700" x2="970" y2="700" stroke="#1a1a1a" stroke-width="1.5"/><text x="538" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">5. Component</text><text x="538" y="735" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Vì sao nó tồn tại, khi nào không dùng?</text><text x="538" y="770" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Component là lý lẽ được thừa hưởng.</text><text x="538" y="796" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Đủ 8 state: default đến empty.</text><text x="538" y="822" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Không resolve? Chạy lại 5 layer lên chính nó.</text><rect x="550" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="600" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="650" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="700" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="750" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="800" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="850" y="875" width="40" height="28" rx="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><rect x="900" y="875" width="40" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="538" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a"><tspan x="538" dy="0">“Button hiện có đã xử lý disabled và loading.</tspan><tspan x="538" dy="22">Làm cái mới thì phải bảo trì hai cái mãi.”</tspan></text><rect x="1000" y="640" width="450" height="460" fill="none" stroke="#1a1a1a" stroke-width="1.5" /><line x1="1000" y1="700" x2="1450" y2="700" stroke="#1a1a1a" stroke-width="1.5"/><text x="1018" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">6. Hai output</text><text x="1018" y="740" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Decision sheet</text><text x="1018" y="766" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">mỗi dòng: thay đổi gì, layer nào,</text><text x="1018" y="804" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">luật nào, câu nói với developer.</text><text x="1018" y="842" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Token audit</text><text x="1018" y="868" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">ghi lại những gì team đang dùng</text><text x="1018" y="892" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">(spacing, type, role), nêu chỗ lệch hoặc chưa định nghĩa.</text><text x="1018" y="930" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B46C1">Nguyên tắc</text><text x="1018" y="956" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">Hỏi, đừng kết tội. “Mình chạy button qua</text><text x="1018" y="980" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">5 check, spacing và disabled chưa resolve. Anh/chị giải thích giúp mình lý do?”</text></svg>