<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay hay màn mới</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Hand-Built Prototype</p>
    <h1>Overlay nằm trong màn, màn mới thay thế màn</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hbp-overlay-vs-screen-title hbp-overlay-vs-screen-desc">
        <title id="hbp-overlay-vs-screen-title">Overlay nằm trong màn</title>
        <desc id="hbp-overlay-vs-screen-desc">Một overlay Xác nhận nằm bên trong màn Chọn giờ, trong khi người dùng vẫn ở màn đó.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Outer ring: the screen -->
        <rect x="40" y="80" width="880" height="380" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1.2"/>
        <rect x="56" y="70" width="176" height="20" fill="#f5f5f5"/>
        <text x="64" y="85" font-family="'Geist Mono', monospace" font-size="12" fill="#4f5d75">FRAME · CHỌN GIỜ</text>

        <!-- Content of the screen: time slots, placeholder content -->
        <g fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="1">
          <rect x="80" y="400" width="116" height="40" rx="6"/>
          <rect x="216" y="400" width="116" height="40" rx="6"/>
          <rect x="352" y="400" width="116" height="40" rx="6"/>
          <rect x="488" y="400" width="116" height="40" rx="6"/>
          <rect x="624" y="400" width="116" height="40" rx="6"/>
          <rect x="760" y="400" width="116" height="40" rx="6"/>
        </g>

        <!-- Inner ring: the overlay, the focal element -->
        <rect x="240" y="150" width="480" height="220" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.6"/>
        <rect x="256" y="140" width="190" height="20" fill="#f5f5f5"/>
        <text x="264" y="155" font-family="'Geist Mono', monospace" font-size="12" fill="#bf4520">OVERLAY · XÁC NHẬN</text>
        <text x="480" y="222" text-anchor="middle" font-family="'Geist', sans-serif" font-size="18" font-weight="600" fill="#2d3142">Xác nhận đặt lịch?</text>
        <text x="480" y="248" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="#5a6580">Nội dung minh họa (bản nháp)</text>
        <rect x="300" y="290" width="150" height="44" rx="6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="375" y="317" text-anchor="middle" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#2d3142">Hủy</text>
        <rect x="510" y="290" width="150" height="44" rx="6" fill="#2d3142"/>
        <text x="585" y="317" text-anchor="middle" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">Xác nhận</text>
      </svg>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:24px;font-size:15px;line-height:1.5;">
      <p><span class="eyebrow" style="color:#bf4520;display:block">Overlay</span>Người dùng vẫn ở màn Chọn giờ. Chỉ có thêm một lớp phía trên.</p>
      <p><span class="eyebrow" style="display:block">Màn mới</span>Người dùng rời màn hiện tại và ngữ cảnh đổi hoàn toàn.</p>
    </div>
  </div>
</body>
</html>
