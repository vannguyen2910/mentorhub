<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component set và bốn loại property</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Components · Diagram Design</p>
    <h1>Component set và bốn loại property</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="component-set-properties-title component-set-properties-desc">
        <title id="component-set-properties-title">Component set và bốn loại property</title>
        <desc id="component-set-properties-desc">Một component set Button có bốn loại property: Variant, Boolean, Text và Instance swap, mỗi loại điều khiển một phần khác nhau của nút.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M568 280 V320 Q568 328 560 328 H180 Q172 328 172 336 V392" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M616 280 V344 Q616 352 608 352 H492 Q484 352 484 360 V392" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M664 280 V344 Q664 352 672 352 H788 Q796 352 796 360 V392" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M712 280 V320 Q712 328 720 328 H1100 Q1108 328 1108 336 V392" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="200" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="520" y="200" width="240" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="640.0" y="238.0" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" >Button</text><text x="640.0" y="256.0" fill="#bf4520" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >component set</text>
<rect x="40" y="392" width="264" height="80" rx="6" fill="#f5f5f5"/><rect x="40" y="392" width="264" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/><text x="172.0" y="430.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" >Variant</text><text x="172.0" y="448.0" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >Size = S | M | L</text>
<rect x="352" y="392" width="264" height="80" rx="6" fill="#f5f5f5"/><rect x="352" y="392" width="264" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/><text x="484.0" y="430.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" >Boolean</text><text x="484.0" y="448.0" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >Has icon = on | off</text>
<rect x="664" y="392" width="264" height="80" rx="6" fill="#f5f5f5"/><rect x="664" y="392" width="264" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/><text x="796.0" y="430.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" >Text</text><text x="796.0" y="448.0" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >Label = chữ</text>
<rect x="976" y="392" width="264" height="80" rx="6" fill="#f5f5f5"/><rect x="976" y="392" width="264" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/><text x="1108.0" y="430.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" >Instance swap</text><text x="1108.0" y="448.0" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >Icon = component</text>
      </svg>
    </div>
  </div>
</body>
</html>
